<style>
  :root{
    --navy:#000E35;
    --red:#CC0000;
    --cream:#F7F5EE;
    --paper:#FFFFFF;
    --line:#E1DDD0;
    --ink:#1C2233;
    --ink-soft:#5B6178;
    --ok:#2E7D46;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Montserrat',system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Montserrat',system-ui,sans-serif;
    font-weight:700;
    color:var(--navy);
    margin:0;
    letter-spacing:-0.01em;
  }
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- Topbar ---------- */
  .topbar{
    background:var(--paper);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .topbar-inner{
    max-width:920px;margin:0 auto;padding:18px 24px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:56px;height:56px;flex:none;
    object-fit:contain;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-text b{font-family:'Montserrat',sans-serif;font-weight:800;font-size:18px;color:var(--navy);letter-spacing:.01em;}
  .brand-text span{font-size:12px;color:var(--ink-soft);}

  /* ---------- Splash screen ---------- */
  body.splash-active{overflow:hidden;}
  .splash-screen{
    position:fixed; inset:0; z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:28px;
    overflow:hidden;
    cursor:pointer;
  }

  }
  .splash-overlay{position:absolute; inset:0; background:rgba(0,0,0,.55); z-index:1; pointer-events:none;}
  .splash-btn{
    position:relative; z-index:2;
    width:240px;height:240px;
    background:transparent; border:none; cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    filter:drop-shadow(0 8px 20px rgba(0,0,0,.45));
    transition:transform .25s ease;
    padding:0;
  }
  .splash-btn:hover{transform:scale(1.15);}
  .splash-btn:active{transform:scale(0.98);}
  .splash-logo{width:240px;height:240px;object-fit:contain;}
  .splash-hint{
    position:relative; z-index:2;
    color:#fff; font-size:14px; font-weight:600; letter-spacing:.02em;
    opacity:.9;
  }

  /* ---------- Layout ---------- */
  .wrap{max-width:920px;margin:0 auto;padding:40px 24px 96px;}
  .page-head{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:20px;margin-bottom:28px;flex-wrap:wrap;
  }
  .page-head h1{font-size:32px;}
  .page-head .sub{color:var(--ink-soft);font-size:14px;margin-top:6px;}
  .section-title{
    font-family:'Montserrat',sans-serif;font-weight:700;font-size:18px;color:var(--navy);
    margin:8px 0 14px;
  }
  .grid + .section-title{margin-top:36px;}
  .btn{
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--navy);
    padding:10px 16px;
    border-radius:8px;
    font-size:14px;font-weight:600;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn:hover{border-color:var(--navy);}
  .btn-ghost{background:transparent;}
  .btn-primary{background:var(--red);color:#fff;border-color:var(--red);}
  .btn-primary:hover{border-color:var(--red);}
  .crumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}

  /* ---------- Admin password modal ---------- */
  .admin-modal{
    position:fixed; inset:0; z-index:200;
    background:rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .admin-modal-box{
    background:var(--paper);
    border-radius:12px;
    padding:28px;
    width:100%; max-width:340px;
    box-shadow:0 12px 40px rgba(0,0,0,.35);
  }
  .admin-modal-box h3{font-size:18px;color:var(--navy);margin-bottom:6px;}
  .admin-modal-sub{font-size:13px;color:var(--ink-soft);margin-bottom:16px;}
  .admin-modal-input{
    width:100%;
    border:1px solid var(--line);
    border-radius:7px;
    padding:10px 12px;
    font-size:14px;
    font-family:inherit;
    margin-bottom:8px;
  }
  .admin-modal-input:focus{outline:none;border-color:var(--navy);}
  .admin-modal-error{color:#C0392B;font-size:12.5px;margin-bottom:8px;}
  .admin-modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:8px;}
  .crumbs .btn{padding:8px 14px;font-size:13px;}

  /* ---------- Card grid (home) ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
  }
  .doc-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px;
    cursor:pointer;
    text-align:left;
    display:flex;flex-direction:column;gap:10px;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .doc-card:hover{
    border-color:var(--navy);
    box-shadow:0 6px 20px rgba(0,14,53,.08);
    transform:translateY(-2px);
  }
  .doc-icon{
    width:34px;height:34px;border-radius:8px;
    background:var(--cream);
    display:flex;align-items:center;justify-content:center;
    color:var(--red);font-size:17px;
  }
  .doc-card h3{font-size:18px;}
  .doc-card p{font-size:13.5px;color:var(--ink-soft);margin:0;}

  /* ---------- Menu dark theme (home + submenus) ---------- */
  body.home-dark{background:#010409;}
  body.home-dark .page-head h1,
  body.home-dark .section-title{color:#fff;}
  body.home-dark .page-head .sub{color:rgba(255,255,255,.7);}
  body.home-dark .doc-card{
    background:#0E1117;
    border-color:rgba(255,255,255,.14);
  }
  body.home-dark .doc-card:hover{
    border-color:#fff;
    box-shadow:0 6px 24px rgba(0,0,0,.35);
  }
  body.home-dark .doc-card h3{color:#fff;}
  body.home-dark .doc-card p{color:rgba(255,255,255,.65);}
  body.home-dark .doc-icon{background:rgba(255,255,255,.1); color:#FF4D4D;}
  body.home-dark .btn{
    background:transparent; color:#fff; border-color:rgba(255,255,255,.3);
  }
  body.home-dark .btn:hover{border-color:#fff;}
  body.home-dark #topbar{background:#010409; border-bottom-color:rgba(255,255,255,.14);}
  body.home-dark .brand-text b{color:#fff;}
  body.home-dark .brand-text span{color:rgba(255,255,255,.65);}

  /* ---------- Form pages dark theme (does NOT affect .doc-preview / generated document) ---------- */
  body.home-dark .crumbs .btn{background:transparent;}
  body.home-dark .section{
    background:#0E1117;
    border-color:rgba(255,255,255,.14);
  }
  body.home-dark .section h2{color:#fff;}
  body.home-dark .section .hint{color:rgba(255,255,255,.6);}
  body.home-dark .field label{color:#fff;}
  body.home-dark .field .opt{color:rgba(255,255,255,.55);}
  body.home-dark .radio-opt,
  body.home-dark .check-row{color:rgba(255,255,255,.85);}
  body.home-dark .autorizante-block{border-color:rgba(255,255,255,.2);}
  body.home-dark .autorizante-block .tag{color:#FF6666;}
  body.home-dark .empty-note{background:rgba(255,248,230,.12);border-color:rgba(240,220,160,.35);color:#F0DCA0;}
  body.home-dark .admin-modal-box{background:#0E1117; border:1px solid rgba(255,255,255,.14);}
  body.home-dark .admin-modal-box h3{color:#fff;}
  body.home-dark .admin-modal-sub{color:rgba(255,255,255,.6);}
  body.home-dark .admin-modal-input{background:#010409; border-color:rgba(255,255,255,.2); color:#fff;}
  body.home-dark .doc-preview-bar{
    background:#0E1117;
    border-bottom-color:rgba(255,255,255,.14);
  }
  body.home-dark .doc-preview-bar span{color:rgba(255,255,255,.7);}
  body.home-dark .doc-preview-bar .btn{background:transparent; color:#fff; border-color:rgba(255,255,255,.3);}
  body.home-dark .doc-preview-bar .btn:hover{border-color:#fff;}

  /* ---------- Form sections ---------- */
  .section{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:26px;
    margin-bottom:18px;
  }
  .section h2{font-size:19px;margin-bottom:4px;}
  .section .hint{color:var(--ink-soft);font-size:13px;margin-bottom:16px;}
  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px 20px;
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:13px;font-weight:600;color:var(--navy);}
  .field .opt{font-weight:400;color:var(--ink-soft);}
  .field input,.field select,.field textarea{
    border:1px solid var(--line);
    border-radius:7px;
    padding:10px 12px;
    font-size:14.5px;
    font-family:inherit;
    background:var(--paper);
    color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--navy);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .radio-row{display:flex;gap:18px;flex-wrap:wrap;padding-top:4px;}
  .radio-opt{display:flex;align-items:center;gap:6px;font-size:14px;}
  .check-row{display:flex;align-items:flex-start;gap:8px;font-size:14px;padding-top:2px;}
  .check-row input{margin-top:3px;}

  .autorizante-block{
    border:1px dashed var(--line);
    border-radius:8px;
    padding:16px;margin-bottom:12px;
    position:relative;
  }
  .autorizante-block .tag{
    font-size:11.5px;font-weight:700;color:var(--red);
    text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;display:block;
  }
  .remove-link{
    position:absolute;top:14px;right:16px;
    font-size:12.5px;color:var(--ink-soft);cursor:pointer;background:none;border:none;
  }
  .remove-link:hover{color:var(--red);}
  .add-link{
    background:none;border:none;color:var(--red);
    font-size:13.5px;font-weight:600;cursor:pointer;padding:4px 0;
  }

  .generate-btn{
    width:100%;
    background:var(--red);
    color:#fff;
    border:none;
    padding:16px;
    border-radius:9px;
    font-size:15.5px;font-weight:700;
    cursor:pointer;
    letter-spacing:.01em;
    transition:background .15s ease;
  }
  .generate-btn:hover{background:#a80000;}

  .submenu-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:16px;
  }

  /* ---------- Document preview ---------- */
  .doc-preview{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:0;
    overflow:hidden;
  }
  .doc-preview-bar{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:var(--cream);
  }
  .doc-preview-bar span{font-size:13px;color:var(--ink-soft);font-weight:600;}
  .doc-preview-actions{display:flex;gap:8px;}
  .doc-body{
    padding:52px 60px;font-size:11pt;line-height:1.5;color:#222;
  }
  .doc-letterhead{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:3px solid var(--navy);
    padding-bottom:16px;margin-bottom:30px;
  }
  .doc-letterhead .lh-brand{display:flex;align-items:center;gap:10px;}
  .doc-letterhead .lh-mark{
    width:28px;height:28px;object-fit:contain;
  }
  .doc-letterhead b{font-family:'Montserrat',sans-serif;font-weight:800;font-size:17px;color:var(--navy);letter-spacing:.01em;}
  .doc-letterhead .lh-meta{text-align:right;font-size:12px;color:var(--ink-soft);}
  .doc-title{
    font-family:'Montserrat',sans-serif;font-weight:700;font-size:23px;color:var(--navy);
    text-align:center;margin-bottom:6px;
  }
  .doc-subtitle{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;}
  .doc-body p{margin:0 0 14px;text-align:justify;line-height:1.5;break-inside:avoid;page-break-inside:avoid;}
  .doc-body .field-line{margin:0 0 8px;text-align:justify;line-height:1.5;break-inside:avoid;page-break-inside:avoid;}
  .doc-body .field-line b{color:var(--navy);}
  .clause{margin-bottom:16px;text-align:justify;line-height:1.5;break-inside:avoid;page-break-inside:avoid;}
  .clause b{color:var(--navy);}
  .sign-row{
    display:flex;justify-content:space-between;margin-top:70px;gap:40px;
    break-inside:avoid;page-break-inside:avoid;
  }
  .sign-box{flex:1;text-align:center;}
  .sign-line{border-top:1px solid #222;margin-bottom:6px;padding-top:36px;}
  .sign-box small{color:#5B6178;}
  .doc-foot{
    margin-top:50px;padding-top:14px;border-top:1px solid var(--line);
    font-size:11px;color:var(--ink-soft);text-align:center;
  }
  .cert-page{
    border-top:2px dashed var(--line);
    margin-top:40px;padding-top:40px;
  }
  .empty-note{
    background:#FFF8E6;border:1px solid #F0DCA0;color:#7A5B00;
    font-size:12.5px;padding:3px 7px;border-radius:5px;
  }

  @media print{
    .topbar,.crumbs,.doc-preview-bar,.no-print{display:none !important;}
    body{background:#fff;}
    .wrap{padding:0;max-width:none;}
    .doc-preview{border:none;border-radius:0;}
    .doc-body{padding:0 20px;}
  }
  @media (max-width:680px){
    .grid,.submenu-grid,.field-grid{grid-template-columns:1fr;}
    .doc-body{padding:34px 22px;}
    .sign-row{flex-direction:column;gap:26px;}
  }
</style>
</head>

<script>
/* ============================================================
   DATOS BASE / MARCA
   ============================================================ */
const AGENCIA = {
  nombre: "RE/MAX Estero",
  razon: "Emprendedores del Estero SAS",
  agente: "Mariano Alfonso Acosta",
  matricula: "CCPISE 238",
  direccion: "Mitre 202, Santiago del Estero",
};

const today = new Date();
const todayISO = today.toISOString().slice(0,10);

function fmtDate(iso){
  if(!iso) return "____/____/______";
  const [y,m,d] = iso.split("-");
  return `<b>${d}/${m}/${y}</b>`;
}
function fmtMoney(v, currency){
  if(v===undefined || v===null || v==="") return "________";
  const n = Number(v);
  if(isNaN(n)) return `<b>${v}</b>`;
  const s = n.toLocaleString("es-AR", {minimumFractionDigits:0, maximumFractionDigits:2});
  return `<b>${currency === "USD" ? `U$S ${s}` : `$ ${s}`}</b>`;
}
function val(v, fallback="________"){
  return (v===undefined || v===null || String(v).trim()==="") ? fallback : `<b>${v}</b>`;
}
function esc(s){
  return String(s===undefined||s===null?"":s);
}
function esSantiagoCiudad(ciudad){
  return (ciudad||"").toString().trim().toLowerCase() === "santiago del estero";
}
const CAPITALIZAR_MINUSCULAS = new Set(["de","del","la","las","los","y"]);
function capitalizar(s){
  if(s===undefined || s===null) return s;
  const str = String(s).trim();
  if(str==="") return s;
  return str.toLowerCase().split(/\s+/).map((w,i)=>{
    if(i>0 && CAPITALIZAR_MINUSCULAS.has(w)) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join(" ");
}

/* ============================================================
   ESTADO / ROUTER
   ============================================================ */
let route = { page: "splash" };
let formState = {}; // per-document working data

function goHome(){ route = {page:"home"}; formState = {}; render(); window.scrollTo(0,0); }
function goTo(page, extra){ route = Object.assign({page}, extra||{}); render(); window.scrollTo(0,0); }
function goSplash(){ route = {page:"splash"}; formState = {}; render(); window.scrollTo(0,0); }
const ADMIN_PASSWORD = "Mitre1976";
let pendingAdminTarget = null;
let pendingAdminAction = null;
function goToAdmin(page, extra){
  pendingAdminTarget = {page, extra};
  pendingAdminAction = null;
  const modal = document.getElementById("adminModal");
  const input = document.getElementById("adminPasswordInput");
  const err = document.getElementById("adminModalError");
  err.style.display = "none";
  input.value = "";
  modal.style.display = "flex";
  setTimeout(()=>input.focus(), 50);
}
/* Igual que goToAdmin, pero en lugar de navegar a una página, ejecuta un callback
   una vez ingresada la contraseña correcta. Queda disponible para futuras
   acciones protegidas por contraseña dentro de un documento ya generado. */
function requireAdminPassword(actionFn){
  pendingAdminTarget = null;
  pendingAdminAction = actionFn;
  const modal = document.getElementById("adminModal");
  const input = document.getElementById("adminPasswordInput");
  const err = document.getElementById("adminModalError");
  err.style.display = "none";
  input.value = "";
  modal.style.display = "flex";
  setTimeout(()=>input.focus(), 50);
}
function closeAdminModal(){
  document.getElementById("adminModal").style.display = "none";
  pendingAdminTarget = null;
  pendingAdminAction = null;
}
function submitAdminPassword(){
  const input = document.getElementById("adminPasswordInput");
  const err = document.getElementById("adminModalError");
  if(input.value === ADMIN_PASSWORD){
    const target = pendingAdminTarget;
    const action = pendingAdminAction;
    closeAdminModal();
    if(action) action();
    else if(target) goTo(target.page, target.extra);
  }else{
    err.style.display = "block";
    input.value = "";
    input.focus();
  }
}

/* ============================================================
   FIELD RENDER HELPERS
   ============================================================ */
function fieldHTML(f, prefix){
  const id = prefix ? `${prefix}__${f.id}` : f.id;
  const cur = getFieldValue(id, f.default);
  const cls = f.full ? "field full" : "field";
  let inner = "";
  if(f.type==="select"){
    inner = `<select id="${id}" onchange="setField('${id}', this.value)">
      ${f.placeholder? `<option value="">${f.placeholder}</option>`:""}
      ${f.options.map(o=>`<option value="${o.v}" ${cur===o.v?"selected":""}>${o.l}</option>`).join("")}
    </select>`;
  } else if(f.type==="textarea"){
    inner = `<textarea id="${id}" oninput="setField('${id}', this.value)" placeholder="${f.placeholder||''}">${esc(cur)}</textarea>`;
  } else if(f.type==="checkbox"){
    return `<div class="${cls}"><div class="check-row">
      <input type="checkbox" id="${id}" onchange="setField('${id}', this.checked)" ${cur?"checked":""}>
      <label style="font-weight:400" for="${id}">${f.label}</label>
    </div></div>`;
  } else if(f.type==="radio"){
    return `<div class="${cls}"><label>${f.label}${f.required?"":""}</label>
      <div class="radio-row">
        ${f.options.map(o=>`<label class="radio-opt"><input type="radio" name="${id}" value="${o.v}" onchange="setField('${id}', this.value)" ${cur===o.v?"checked":""}> ${o.l}</label>`).join("")}
      </div></div>`;
  } else {
    inner = `<input type="${f.type||'text'}" id="${id}" value="${esc(cur)}" placeholder="${f.placeholder||''}" oninput="setField('${id}', this.value)">`;
  }
  return `<div class="${cls}"><label for="${id}">${f.label}${f.opt?` <span class="opt">(${f.opt})</span>`:""}</label>${inner}</div>`;
}

function getFieldValue(id, dflt){
  if(formState[id] !== undefined) return formState[id];
  return dflt !== undefined ? dflt : "";
}
function setField(id, value){
  formState[id] = value;
}

function sectionHTML(title, hint, fieldsHTML){
  return `<div class="section"><h2>${title}</h2>${hint?`<p class="hint">${hint}</p>`:""}<div class="field-grid">${fieldsHTML}</div></div>`;
}

/* Dynamic repeatable group (autorizantes / firmantes) */
function repeaterHTML(groupId, label, fieldsDef, minCount, addLabel){
  const countKey = `__count_${groupId}`;
  let count = formState[countKey] || minCount;
  let html = "";
  for(let i=0;i<count;i++){
    const prefix = `${groupId}${i}`;
    html += `<div class="autorizante-block">
      <span class="tag">${label} ${i+1}${i===0?" · figura como parte principal en el texto":""}</span>
      ${i>=minCount ? `<button class="remove-link" onclick="removeRepeater('${groupId}', ${i})">Quitar</button>` : ""}
      <div class="field-grid">${fieldsDef.map(f=>fieldHTML(f, prefix)).join("")}</div>
    </div>`;
  }
  html += `<button class="add-link" onclick="addRepeater('${groupId}')">${addLabel}</button>`;
  return html;
}
function addRepeater(groupId){
  const countKey = `__count_${groupId}`;
  formState[countKey] = (formState[countKey]||1) + 1;
  render();
}
function removeRepeater(groupId, idx){
  const countKey = `__count_${groupId}`;
  formState[countKey] = Math.max(1, (formState[countKey]||1) - 1);
  render();
}
function repeaterData(groupId, count, fieldIds){
  const out = [];
  for(let i=0;i<count;i++){
    const row = {};
    fieldIds.forEach(fid=>{
      let v = formState[`${groupId}${i}__${fid}`];
      if(fid==="nombre" || fid==="domicilio" || fid==="direccion" || fid==="barrio" || fid==="distrito") v = capitalizar(v);
      row[fid] = v;
    });
    out.push(row);
  }
  return out;
}
function getCount(groupId, min){ return formState[`__count_${groupId}`] || min; }

/* ============================================================

const MESES_ES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fechaVigenciaLarga(iso){
  if(!iso) return "________";
  const [y,m,d] = iso.split("-");
  return `<b>${Number(d)} de ${MESES_ES[Number(m)-1]} de ${y}</b>`;
}
function fechaFirmaLarga(iso){
  if(!iso) return {dia:"________", mes:"________", anio:"________"};
  const [y,m,d] = iso.split("-");
  return {dia:`<b>${Number(d)}</b>`, mes:`<b>${MESES_ES[Number(m)-1]}</b>`, anio:`<b>${y}</b>`};
}

/* ---- Número a palabras (español) ---- */
const NW_UNIDADES = ["", "uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve"];
const NW_DIECIS   = ["diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve"];
const NW_DECENAS  = ["", "diez","veinte","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
const NW_CENTENAS = ["", "ciento","doscientos","trescientos","cuatrocientos","quinientos","seiscientos","setecientos","ochocientos","novecientos"];
function nwGrupo(n){
  if(n===0) return "";
  if(n===100) return "cien";
  let out = "";
  const c = Math.floor(n/100), resto = n%100;
  if(c>0) out += NW_CENTENAS[c] + " ";
  if(resto>0){
    if(resto<10) out += NW_UNIDADES[resto];
    else if(resto<20) out += NW_DIECIS[resto-10];
    else {
      const dd = Math.floor(resto/10), u = resto%10;
      if(dd===2 && u>0) out += "veinti"+NW_UNIDADES[u];
      else { out += NW_DECENAS[dd]; if(u>0) out += " y " + NW_UNIDADES[u]; }
    }
  }
  return out.trim();
}
function numToWordsEs(num){
  if(num===undefined || num===null || num==="") return "________";
  num = Math.floor(Number(num));
  if(isNaN(num)) return "________";
  if(num===0) return "<b>cero</b>";
  let out = "";
  const millones = Math.floor(num/1000000);
  const miles = Math.floor((num%1000000)/1000);
  const resto = num%1000;
  if(millones>0) out += (millones===1? "un millón" : nwGrupo(millones)+" millones") + " ";
  if(miles>0) out += (miles===1? "mil" : nwGrupo(miles)+" mil") + " ";
  if(resto>0) out += nwGrupo(resto);
  return `<b>${out.trim()}</b>`;
}
function fmtNumberPlain(v){
  if(v===undefined || v===null || v==="") return "________";
  const n = Number(v);
  if(isNaN(n)) return `<b>${v}</b>`;
  return `<b>${n.toLocaleString("es-AR")}</b>`;
}
function fmtDNI(v){
  if(v===undefined || v===null || String(v).trim()==="") return "________";
  const digits = String(v).replace(/\D/g,"");
  if(digits==="") return `<b>${v}</b>`;
  return `<b>${digits.replace(/\B(?=(\d{3})+(?!\d))/g, ".")}</b>`;
}

/* Repetidor de autorizantes propio de Autorización de Venta: a diferencia del
   repetidor genérico, cada fila tiene un check "Es persona jurídica" que
   cambia el set de campos mostrados (datos de la sociedad + representante
   en vez de los datos de una persona física). */
function renderAutorizantesVenta(count){
  let html = "";
  for(let i=0;i<count;i++){
    const prefix = `autV${i}`;
    const esJuridica = !!formState[`${prefix}__es_juridica`];
    html += `<div class="autorizante-block">
      <span class="tag">Autorizante ${i+1}${i===0?" · figura como parte principal en el texto":""}</span>
      ${i>=1 ? `<button class="remove-link" onclick="removeRepeater('autV', ${i})">Quitar</button>` : ""}
      <div class="check-row" style="margin:6px 0 14px;">
        <input type="checkbox" id="${prefix}__es_juridica" ${esJuridica?"checked":""} onchange="toggleAutorizanteJuridica('${prefix}', this.checked)">
        <label style="font-weight:400" for="${prefix}__es_juridica">Es una persona jurídica (empresa/sociedad) — firma un representante</label>
      </div>
      <div class="field-grid">${(esJuridica ? AUTORIZANTE_VENTA_JURIDICA_FIELDS : AUTORIZANTE_VENTA_FIELDS).map(f=>fieldHTML(f, prefix)).join("")}</div>
    </div>`;
  }
  html += `<button class="add-link" onclick="addRepeater('autV')">+ Agregar otro autorizante (cotitular)</button>`;
  return html;
}
function toggleAutorizanteJuridica(prefix, checked){
  formState[`${prefix}__es_juridica`] = checked;
  render();
}

function generateContraoferta(){

function generateRecibo(grupo, tipo){
  const info = RECIBO_TIPOS[grupo].items[tipo];
  const isVenta = grupo==="venta";
  const d = {};
  ["nombre","dni","telefono","ciudad","domicilio","direccion","distrito_inmueble","localidad","provincia_inmueble","nro_oferta","fecha_oferta",
   "monto","precio_pub","pct","precio_final","monto_previo","fecha_refuerzo","pct_integrado","motivo",
   "es_reserva_o_sena","monto_ars","fecha_recibo"].forEach(k=>d[k]=formState[k]);
  d.fecha_recibo = d.fecha_recibo || todayISO;
  d.fecha_oferta = d.fecha_oferta || todayISO;
  d.ciudad = d.ciudad || "Santiago del Estero";
  d.localidad = d.localidad || "Santiago del Estero";
  d.provincia_inmueble = d.provincia_inmueble || "Santiago del Estero";
  d.nombre = capitalizar(d.nombre);
  d.domicilio = capitalizar(d.domicilio);
  d.direccion = capitalizar(d.direccion);
  d.distrito_inmueble = capitalizar(d.distrito_inmueble);

  let montoTxt = "";
  let cuerpo = "";

  if(tipo==="reserva" && isVenta){
    const concepto = d.es_reserva_o_sena==="Seña" ? "seña" : "reserva";
    montoTxt = fmtMoney(d.monto,"USD");
    cuerpo = `<p>Recibí de manos de ${val(d.nombre)}, DNI ${fmtDNI(d.dni)}, la suma de <b>${montoTxt}</b> en concepto de <b>${concepto}</b> a cuenta de precio
    por la compra del inmueble sito en ${val(d.direccion)}${d.distrito_inmueble?`, Distrito ${val(d.distrito_inmueble)}`:""}, ${val(d.localidad)}${esSantiagoCiudad(d.localidad) ? "" : `, ${val(d.provincia_inmueble)}`}, conforme oferta de compra N° ${val(d.nro_oferta,"—")} de fecha ${fmtDate(d.fecha_oferta)},
    sobre un valor publicado de ${fmtMoney(d.precio_pub,"USD")} (${val(d.pct)}% del valor ofertado).</p>`;
  } else if(tipo==="refuerzo"){
    montoTxt = fmtMoney(d.monto,"USD");
    cuerpo = `<p>Recibí de manos de ${val(d.nombre)}, DNI ${fmtDNI(d.dni)}, la suma de <b>${montoTxt}</b> en concepto de <b>refuerzo de reserva</b> a cuenta de precio

  } else if(tipo==="honorarios" && isVenta){
    montoTxt = fmtMoney(d.monto,"USD");
    cuerpo = `<p>Recibí de manos de ${val(d.nombre)}, DNI ${fmtDNI(d.dni)}, la suma de <b>${montoTxt}</b> en concepto de <b>honorarios profesionales</b>
    por la intermediación en la compraventa del inmueble sito en ${val(d.direccion)}${d.distrito_inmueble?`, Distrito ${val(d.distrito_inmueble)}`:""}, ${val(d.localidad)}${esSantiagoCiudad(d.localidad) ? "" : `, ${val(d.provincia_inmueble)}`}, oferta N° ${val(d.nro_oferta,"—")} de fecha ${fmtDate(d.fecha_oferta)}.</p>`;
  } else if(tipo==="reserva" && !isVenta){
    montoTxt = `$ ${fmtNumberPlain(d.monto_ars)}`;

  } else if(tipo==="devolucion" && !isVenta){

  const firmaSub = (tipo==="devolucion" && isVenta) ? `DNI ${fmtDNI(d.dni)}` : `DNI ${fmtDNI(d.dni)} · ${val(d.ciudad)}`;

  const body = `

    <div class="doc-title">${info.titulo}${!isVenta?" (en pesos)":""}</div>
    ${(tipo==="devolucion" && isVenta) ? "" : `<div class="doc-subtitle">${AGENCIA.nombre} · ${AGENCIA.agente}, ${AGENCIA.matricula} · ${fmtDate(d.fecha_recibo)}</div>`}
    ${cuerpo}

      ${signBox(AGENCIA.agente, `${AGENCIA.nombre} · ${AGENCIA.matricula}`)}

let lastDocTitle = "";
function showPreview(title, bodyHTML){
  lastDocTitle = title;
  document.getElementById("app").innerHTML = `
    <div class="crumbs no-print">
      <button class="btn" onclick="render()">← Volver a corregir</button>
      <button class="btn" onclick="goHome()">← Elegir otro documento</button>
    </div>
    <div class="doc-preview">
      <div class="doc-preview-bar no-print">
        <span>Vista previa — ${title}</span>
        <div class="doc-preview-actions">
          <button class="btn" id="pdf-download-btn" onclick="downloadPdf()">⬇ Guardar PDF</button>
        </div>
      </div>
      <div class="doc-body">${bodyHTML}</div>
    </div>
  `;
  window.scrollTo(0,0);
}

function downloadPdf(){
  const original = document.querySelector(".doc-body");
  if(!original) return;
  const btn = document.getElementById("pdf-download-btn");
  const originalLabel = btn ? btn.textContent : "";
  if(btn){ btn.disabled = true; btn.textContent = "Generando PDF…"; }

  const filename = (lastDocTitle || "documento")
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-zA-Z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "")
    .toLowerCase() + ".pdf";

  /* El documento se genera siempre con el mismo diseño "de escritorio", sin
     importar si se genera desde una PC o desde un celular. html2pdf ya renderiza
     internamente todo documento dentro de un lienzo del ancho de la hoja (A4),
     así que el ancho no hay que forzarlo: lo único que cambia entre celular y PC
     es la regla de diseño para pantallas chicas (@media max-width:680px), que
     achica el padding del documento y apila las firmas una debajo de la otra.
     Por eso, antes de capturar, forzamos en el propio elemento el padding y la
     disposición de firmas que se usan en la vista de escritorio, y al terminar
     restauramos los estilos originales de la pantalla. */
  const el = original;
  const prevPadding = el.style.padding;
  const signRows = el.querySelectorAll(".sign-row");
  const prevSignRowStyles = Array.from(signRows).map(row => ({
    flexDirection: row.style.flexDirection,
    gap: row.style.gap
  }));

  el.style.padding = "52px 60px";
  signRows.forEach(row=>{
    row.style.flexDirection = "row";
    row.style.gap = "40px";
  });

  const restoreStyles = ()=>{
    el.style.padding = prevPadding;
    signRows.forEach((row, i)=>{
      row.style.flexDirection = prevSignRowStyles[i].flexDirection;
      row.style.gap = prevSignRowStyles[i].gap;
    });
  };

  const opt = {
    margin: [12, 12, 12, 12],
    filename: filename,
    image: { type: "jpeg", quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, backgroundColor: "#ffffff" },
    jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
    /* Usamos solo el modo "css" (sin "legacy"): combinar ambos es lo que hacía que,
       sobre todo en celulares, un párrafo que cae justo en el borde de una hoja
       se corte y además se duplique parte del texto en la hoja siguiente. Con
       "css" + estas reglas de "no cortar adentro" en el CSS, un párrafo o
       cláusula que no entra completo en la hoja se manda entero a la próxima,
       en vez de cortarse a la mitad. El membrete/título quedan afuera de esta
       lista: al ser el primer bloque de la página, incluirlos acá podía hacer
       que algunos celulares agregaran un espacio en blanco arriba de todo. */
    pagebreak: { mode: ["css"], avoid: [".sign-row", ".sign-box", ".clause", ".doc-body p", ".field-line"] }
  };

  /* Esperamos a que las fuentes (Montserrat, Google Fonts) terminen de cargar antes de
     capturar el documento: si el PDF se genera muy rápido después de completar el
     formulario, algunas fuentes pueden no estar listas todavía y ciertos textos
     (como las aclaraciones debajo de las firmas) pueden no capturarse correctamente. */
  const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();

  fontsReady.then(()=>{
    return html2pdf().set(opt).from(el).save();
  }).then(()=>{
    restoreStyles();
    if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
  }).catch((err)=>{
    console.error(err);
    restoreStyles();
    if(btn){ btn.disabled = false; btn.textContent = originalLabel; }
    alert("No se pudo generar el PDF. Probá de nuevo.");
  });
}

  return `
    <div class="crumbs no-print"><button class="btn" onclick="goHome()">← Elegir otro documento</button></div>
    <div class="page-head"><div><h1 style="font-size:26px">Documentación UIF</h1><div class="sub">${AGENCIA.nombre} · ${AGENCIA.agente}, ${AGENCIA.matricula}</div></div></div>
    <div class="submenu-grid">
      <button class="doc-card" onclick="goTo('uif-form', {tipo:'Comprador'})"><div class="doc-icon">🧾</div><h3>Comprador</h3><p>Declaración jurada UIF del comprador.</p></button>
      <button class="doc-card" onclick="goTo('uif-form', {tipo:'Vendedor'})"><div class="doc-icon">🧾</div><h3>Vendedor</h3><p>Declaración jurada UIF del vendedor.</p></button>
    </div>
  `;
}

function renderRecibosHome(){
  return `
    <div class="crumbs no-print"><button class="btn" onclick="goHome()">← Elegir otro documento</button></div>
    <div class="page-head"><div><h1 style="font-size:26px">Recibo</h1><div class="sub">${AGENCIA.nombre} · ${AGENCIA.agente}, ${AGENCIA.matricula}</div></div></div>
    <div class="submenu-grid">
      <button class="doc-card" onclick="goTo('recibos-sub', {grupo:'venta'})"><div class="doc-icon">🏠</div><h3>Recibos de Venta</h3><p>${RECIBO_TIPOS.venta.desc}</p></button>
      <button class="doc-card" onclick="goTo('recibos-sub', {grupo:'alquiler'})"><div class="doc-icon">🔑</div><h3>Recibos de Alquiler</h3><p>${RECIBO_TIPOS.alquiler.desc}</p></button>
    </div>
  `;
}

function renderRecibosSub(grupo){
  const items = RECIBO_TIPOS[grupo].items;
  const titles = {
    reserva: grupo==="venta" ? "Recibo de Reserva / Seña" : "Recibo de Reserva de Alquiler",
    refuerzo: "Recibo de Refuerzo de Reserva",
    devolucion: grupo==="venta" ? "Recibo de Devolución de Seña" : "Recibo — Devolución de Reserva de Alquiler",
    honorarios: grupo==="venta" ? "Recibo de Honorarios" : "Recibo de Honorarios (Alquiler)",
  };
  const cards = Object.keys(items).map(k=>`
    <button class="doc-card" onclick="goTo('recibo-form', {grupo:'${grupo}', tipo:'${k}'})">
      <div class="doc-icon">🧾</div><h3>${titles[k]}</h3><p></p>
    </button>`).join("");
  return `
    <div class="crumbs no-print"><button class="btn" onclick="goTo('recibos')">← Volver</button></div>
    <div class="page-head"><div><h1 style="font-size:26px">Carga de Documentación</h1><div class="sub">${AGENCIA.nombre} · ${AGENCIA.agente}, ${AGENCIA.matricula}</div></div></div>
    <div class="submenu-grid">${cards}</div>
  `;
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(){
  const app = document.getElementById("app");
  const topbar = document.getElementById("topbar");
  if(topbar) topbar.style.display = (route.page === "splash") ? "none" : "";
  document.body.classList.toggle("splash-active", route.page === "splash");
  document.body.classList.toggle("home-dark", route.page !== "splash");
  switch(route.page){
    case "splash":
      app.innerHTML = renderSplash(); break;
    case "home":
      app.innerHTML = renderHome(); break;
    case "venta-exclusiva":
      app.innerHTML = formPage("Autorización de Venta","","Elegir otro documento","goHome()", renderVentaExclusiva()); break;
    case "modificacion-precio":
      app.innerHTML = formPage("Autorización de Modificación de Precio","","Elegir otro documento","goHome()", renderModificacionPrecio()); break;
    case "locacion-exclusiva":
      app.innerHTML = formPage("Autorización de Locación Exclusiva","","Elegir otro documento","goHome()", renderLocacionExclusiva()); break;
    case "oferta-compra":
      app.innerHTML = renderOfertaCompraHome(); break;
    case "oferta-compra-form":
      app.innerHTML = formPage(OFERTA_COMPRA_TITULOS[route.tipo] || "Oferta de Compra","","Elegir otro tipo de oferta","goTo('oferta-compra')", renderOfertaCompra(route.tipo)); break;
    case "contraoferta":
      app.innerHTML = formPage("Rechazo de Oferta — Contraoferta","","Elegir otro documento","goHome()", renderContraoferta()); break;
    case "aceptacion-oferta":
      app.innerHTML = renderAceptacionHome(); break;
    case "aceptacion-form":
      app.innerHTML = formPage(ACEPTACION_TITULOS[route.tipo] || "Aceptación de Oferta de Compra","","Elegir otro tipo","goTo('aceptacion-oferta')", renderAceptacion(route.tipo)); break;
    case "uif":
      app.innerHTML = renderUIFHome(); break;
    case "uif-form":
      app.innerHTML = formPage(`Documentación UIF — ${route.tipo}`,"","Elegir otro formulario UIF","goTo('uif')", renderUIF(route.tipo)); break;
    case "recibos":
      app.innerHTML = renderRecibosHome(); break;
    case "recibos-sub":
      app.innerHTML = renderRecibosSub(route.grupo); break;
    case "recibo-form":
      app.innerHTML = formPage("Carga de Documentación","","Elegir otro recibo",`goTo('recibos-sub',{grupo:'${route.grupo}'})`, renderReciboForm(route.grupo, route.tipo)); break;
    default:
      app.innerHTML = renderHome();
  }
}

render();
</script>
</body>
</html>
