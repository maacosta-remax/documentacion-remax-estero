<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carga de Documentación · RE/MAX Estero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#000E35;
    --red:#CC0000;
    --cream:#F7F5EE;
    --paper:#FFFFFF;
    --line:#E1DDD0;
    --ink:#1C2233;
    --ink-soft:#5B6178;
    --ok:#2E7D46;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Montserrat',system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Montserrat',system-ui,sans-serif;
    font-weight:700;
    color:var(--navy);
    margin:0;
    letter-spacing:-0.01em;
  }
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- Topbar ---------- */
  .topbar{
    background:var(--paper);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:20;
  }
  .topbar-inner{
    max-width:920px;margin:0 auto;padding:18px 24px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:32px;height:32px;flex:none;
    object-fit:contain;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-text b{font-family:'Montserrat',sans-serif;font-weight:800;font-size:18px;color:var(--navy);letter-spacing:.01em;}
  .brand-text span{font-size:12px;color:var(--ink-soft);}

  /* ---------- Layout ---------- */
  .wrap{max-width:920px;margin:0 auto;padding:40px 24px 96px;}
  .page-head{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:20px;margin-bottom:28px;flex-wrap:wrap;
  }
  .page-head h1{font-size:32px;}
  .page-head .sub{color:var(--ink-soft);font-size:14px;margin-top:6px;}
  .btn{
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--navy);
    padding:10px 16px;
    border-radius:8px;
    font-size:14px;font-weight:600;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    transition:border-color .15s ease, background .15s ease;
  }
  .btn:hover{border-color:var(--navy);}
  .btn-ghost{background:transparent;}
  .crumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
  .crumbs .btn{padding:8px 14px;font-size:13px;}

  /* ---------- Card grid (home) ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
  }
  .doc-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:22px;
    cursor:pointer;
    text-align:left;
    display:flex;flex-direction:column;gap:10px;
    transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .doc-card:hover{
    border-color:var(--navy);
    box-shadow:0 6px 20px rgba(0,14,53,.08);
    transform:translateY(-2px);
  }
  .doc-icon{
    width:34px;height:34px;border-radius:8px;
    background:var(--cream);
    display:flex;align-items:center;justify-content:center;
    color:var(--red);font-size:17px;
  }
  .doc-card h3{font-size:18px;}
  .doc-card p{font-size:13.5px;color:var(--ink-soft);margin:0;}

  /* ---------- Form sections ---------- */
  .section{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:26px;
    margin-bottom:18px;
  }
  .section h2{font-size:19px;margin-bottom:4px;}
  .section .hint{color:var(--ink-soft);font-size:13px;margin-bottom:16px;}
  .field-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px 20px;
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:13px;font-weight:600;color:var(--navy);}
  .field .opt{font-weight:400;color:var(--ink-soft);}
  .field input,.field select,.field textarea{
    border:1px solid var(--line);
    border-radius:7px;
    padding:10px 12px;
    font-size:14.5px;
    font-family:inherit;
    background:var(--paper);
    color:var(--ink);
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--navy);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .radio-row{display:flex;gap:18px;flex-wrap:wrap;padding-top:4px;}
  .radio-opt{display:flex;align-items:center;gap:6px;font-size:14px;}
  .check-row{display:flex;align-items:flex-start;gap:8px;font-size:14px;padding-top:2px;}
  .check-row input{margin-top:3px;}

  .autorizante-block{
    border:1px dashed var(--line);
    border-radius:8px;
    padding:16px;margin-bottom:12px;
    position:relative;
  }
  .autorizante-block .tag{
    font-size:11.5px;font-weight:700;color:var(--red);
    text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;display:block;
  }
  .remove-link{
    position:absolute;top:14px;right:16px;
    font-size:12.5px;color:var(--ink-soft);cursor:pointer;background:none;border:none;
  }
  .remove-link:hover{color:var(--red);}
  .add-link{
    background:none;border:none;color:var(--red);
    font-size:13.5px;font-weight:600;cursor:pointer;padding:4px 0;
  }

  .generate-btn{
    width:100%;
    background:var(--red);
    color:#fff;
    border:none;
    padding:16px;
    border-radius:9px;
    font-size:15.5px;font-weight:700;
    cursor:pointer;
    letter-spacing:.01em;
    transition:background .15s ease;
  }
  .generate-btn:hover{background:#a80000;}

  .submenu-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:16px;
  }

  /* ---------- Document preview ---------- */
  .doc-preview{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:10px;
    padding:0;
    overflow:hidden;
  }
  .doc-preview-bar{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 22px;border-bottom:1px solid var(--line);
    background:var(--cream);
  }
  .doc-preview-bar span{font-size:13px;color:var(--ink-soft);font-weight:600;}
  .doc-body{
    padding:52px 60px;font-size:11pt;line-height:1.2;color:#222;
  }
  .doc-letterhead{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:3px solid var(--navy);
    padding-bottom:16px;margin-bottom:30px;
  }
  .doc-letterhead .lh-brand{display:flex;align-items:center;gap:10px;}
  .doc-letterhead .lh-mark{
    width:28px;height:28px;object-fit:contain;
  }
  .doc-letterhead b{font-family:'Montserrat',sans-serif;font-weight:800;font-size:17px;color:var(--navy);letter-spacing:.01em;}
  .doc-letterhead .lh-meta{text-align:right;font-size:12px;color:var(--ink-soft);}
  .doc-title{
    font-family:'Montserrat',sans-serif;font-weight:700;font-size:23px;color:var(--navy);
    text-align:center;margin-bottom:6px;
  }
  .doc-subtitle{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-bottom:32px;}
  .doc-body p{margin:0 0 14px;text-align:justify;line-height:1.2;}
  .doc-body .field-line{margin:0 0 8px;text-align:justify;line-height:1.2;}
  .doc-body .field-line b{color:var(--navy);}
  .clause{margin-bottom:16px;text-align:justify;line-height:1.2;}
  .clause b{color:var(--navy);}
  .sign-row{
    display:flex;justify-content:space-between;margin-top:70px;gap:40px;
  }
  .sign-box{flex:1;text-align:center;}
  .sign-line{border-top:1px solid #222;margin-bottom:6px;padding-top:36px;}
  .sign-box small{color:var(--ink-soft);}
  .doc-foot{
    margin-top:50px;padding-top:14px;border-top:1px solid var(--line);
    font-size:11px;color:var(--ink-soft);text-align:center;
  }
  .cert-page{
    border-top:2px dashed var(--line);
    margin-top:40px;padding-top:40px;
  }
  .empty-note{
    background:#FFF8E6;border:1px solid #F0DCA0;color:#7A5B00;
    font-size:12.5px;padding:3px 7px;border-radius:5px;
  }

  @media print{
    .topbar,.crumbs,.doc-preview-bar,.no-print{display:none !important;}
    body{background:#fff;}
    .wrap{padding:0;max-width:none;}
    .doc-preview{border:none;border-radius:0;}
    .doc-body{padding:0 20px;}
  }
  @media (max-width:680px){
    .grid,.submenu-grid,.field-grid{grid-template-columns:1fr;}
    .doc-body{padding:34px 22px;}
    .sign-row{flex-direction:column;gap:26px;}
  }
</style>
</head>

<script>
/* ============================================================
   DATOS BASE / MARCA
   ============================================================ */
const AGENCIA = {
  nombre: "RE/MAX Estero",
  razon: "Emprendedores del Estero SAS",
  agente: "Mariano Alfonso Acosta",
  matricula: "CCPISE 238",
  direccion: "Mitre 202, Santiago del Estero",
};

const today = new Date();
const todayISO = today.toISOString().slice(0,10);

function fmtDate(iso){
  if(!iso) return "____/____/______";
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function fmtMoney(v, currency){
  if(v===undefined || v===null || v==="") return "________";
  const n = Number(v);
  if(isNaN(n)) return v;
  const s = n.toLocaleString("es-AR", {minimumFractionDigits:0, maximumFractionDigits:2});
  return currency === "USD" ? `U$S ${s}` : `$ ${s}`;
}
function val(v, fallback="________"){
  return (v===undefined || v===null || String(v).trim()==="") ? fallback : v;
}
function esc(s){
  return String(s===undefined||s===null?"":s);
}

/* ============================================================
   ESTADO / ROUTER
   ============================================================ */
let route = { page: "home" };
let formState = {}; // per-document working data

function goHome(){ route = {page:"home"}; formState = {}; render(); window.scrollTo(0,0); }
function goTo(page, extra){ route = Object.assign({page}, extra||{}); render(); window.scrollTo(0,0); }

/* ============================================================
   FIELD RENDER HELPERS
   ============================================================ */
function fieldHTML(f, prefix){
  const id = prefix ? `${prefix}__${f.id}` : f.id;
  const cur = getFieldValue(id, f.default);
  const cls = f.full ? "field full" : "field";
  let inner = "";
  if(f.type==="select"){
    inner = `<select id="${id}" onchange="setField('${id}', this.value)">
      ${f.placeholder? `<option value="">${f.placeholder}</option>`:""}
      ${f.options.map(o=>`<option value="${o.v}" ${cur===o.v?"selected":""}>${o.l}</option>`).join("")}
    </select>`;
  } else if(f.type==="textarea"){
    inner = `<textarea id="${id}" oninput="setField('${id}', this.value)" placeholder="${f.placeholder||''}">${esc(cur)}</textarea>`;
  } else if(f.type==="checkbox"){
    return `<div class="${cls}"><div class="check-row">
      <input type="checkbox" id="${id}" onchange="setField('${id}', this.checked)" ${cur?"checked":""}>
      <label style="font-weight:400" for="${id}">${f.label}</label>
    </div></div>`;
  } else if(f.type==="radio"){
    return `<div class="${cls}"><label>${f.label}${f.required?"":""}</label>
      <div class="radio-row">
        ${f.options.map(o=>`<label class="radio-opt"><input type="radio" name="${id}" value="${o.v}" onchange="setField('${id}', this.value)" ${cur===o.v?"checked":""}> ${o.l}</label>`).join("")}
      </div></div>`;
  } else {
    inner = `<input type="${f.type||'text'}" id="${id}" value="${esc(cur)}" placeholder="${f.placeholder||''}" oninput="setField('${id}', this.value)">`;
  }
  return `<div class="${cls}"><label for="${id}">${f.label}${f.opt?` <span class="opt">(${f.opt})</span>`:""}</label>${inner}</div>`;
}

function getFieldValue(id, dflt){
  if(formState[id] !== undefined) return formState[id];
  return dflt !== undefined ? dflt : "";
}
function setField(id, value){
  formState[id] = value;
}

function sectionHTML(title, hint, fieldsHTML){
  return `<div class="section"><h2>${title}</h2>${hint?`<p class="hint">${hint}</p>`:""}<div class="field-grid">${fieldsHTML}</div></div>`;
}

/* Dynamic repeatable group (autorizantes / firmantes) */
function repeaterHTML(groupId, label, fieldsDef, minCount, addLabel){
  const countKey = `__count_${groupId}`;
  let count = formState[countKey] || minCount;
  let html = "";
  for(let i=0;i<count;i++){
    const prefix = `${groupId}${i}`;
    html += `<div class="autorizante-block">
      <span class="tag">${label} ${i+1}${i===0?" · figura como parte principal en el texto":""}</span>
      ${i>=minCount ? `<button class="remove-link" onclick="removeRepeater('${groupId}', ${i})">Quitar</button>` : ""}
      <div class="field-grid">${fieldsDef.map(f=>fieldHTML(f, prefix)).join("")}</div>
    </div>`;
  }
  html += `<button class="add-link" onclick="addRepeater('${groupId}')">${addLabel}</button>`;
  return html;
}
function addRepeater(groupId){
  const countKey = `__count_${groupId}`;
  formState[countKey] = (formState[countKey]||1) + 1;
  render();
}
function removeRepeater(groupId, idx){
  const countKey = `__count_${groupId}`;
  formState[countKey] = Math.max(1, (formState[countKey]||1) - 1);
  render();
}
function repeaterData(groupId, count, fieldIds){
  const out = [];
  for(let i=0;i<count;i++){
    const row = {};
    fieldIds.forEach(fid=>{ row[fid] = formState[`${groupId}${i}__${fid}`]; });
    out.push(row);
  }
  return out;
}
function getCount(groupId, min){ return formState[`__count_${groupId}`] || min; }

/* ============================================================
   DOCUMENT LETTERHEAD / SIGN BLOCK
   ============================================================ */

const MESES_ES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
function fechaVigenciaLarga(iso){
  if(!iso) return "________";
  const [y,m,d] = iso.split("-");
  return `${Number(d)} de ${MESES_ES[Number(m)-1]} de ${y}`;
}
function fechaFirmaLarga(iso){
  if(!iso) return {dia:"________", mes:"________", anio:"________"};
  const [y,m,d] = iso.split("-");
  return {dia:String(Number(d)), mes:MESES_ES[Number(m)-1], anio:y};
}

/* ---- Número a palabras (español) ---- */
const NW_UNIDADES = ["", "uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve"];
const NW_DIECIS   = ["diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve"];
const NW_DECENAS  = ["", "diez","veinte","treinta","cuarenta","cincuenta","sesenta","setenta","ochenta","noventa"];
const NW_CENTENAS = ["", "ciento","doscientos","trescientos","cuatrocientos","quinientos","seiscientos","setecientos","ochocientos","novecientos"];
function nwGrupo(n){
  if(n===0) return "";
  if(n===100) return "cien";
  let out = "";
  const c = Math.floor(n/100), resto = n%100;
  if(c>0) out += NW_CENTENAS[c] + " ";
  if(resto>0){
    if(resto<10) out += NW_UNIDADES[resto];
    else if(resto<20) out += NW_DIECIS[resto-10];
    else {
      const dd = Math.floor(resto/10), u = resto%10;
      if(dd===2 && u>0) out += "veinti"+NW_UNIDADES[u];
      else { out += NW_DECENAS[dd]; if(u>0) out += " y " + NW_UNIDADES[u]; }
    }
  }
  return out.trim();
}
function numToWordsEs(num){
  if(num===undefined || num===null || num==="") return "________";
  num = Math.floor(Number(num));
  if(isNaN(num)) return "________";
  if(num===0) return "cero";
  let out = "";
  const millones = Math.floor(num/1000000);
  const miles = Math.floor((num%1000000)/1000);
  const resto = num%1000;
  if(millones>0) out += (millones===1? "un millón" : nwGrupo(millones)+" millones") + " ";
  if(miles>0) out += (miles===1? "mil" : nwGrupo(miles)+" mil") + " ";
  if(resto>0) out += nwGrupo(resto);
  return out.trim();
}
function fmtNumberPlain(v){
  if(v===undefined || v===null || v==="") return "________";
  const n = Number(v);
  if(isNaN(n)) return v;
  return n.toLocaleString("es-AR");
}

    <div class="clause"><b>9.</b> ${plural?"Los Autorizantes autorizan":"La Autorizante autoriza"} expresamente a El Profesional a realizar todas las acciones de

    <div class="section"><h2>Monto</h2><div class="field-grid">
      ${extra}
      ${fieldHTML({id:"fecha_recibo", label:"Fecha del recibo", type:"date", default: todayISO})}
    </div></div>
    <button class="generate-btn no-print" onclick="generateRecibo('${grupo}','${tipo}')">Generar documento</button>
  `;
}

function generateRecibo(grupo, tipo){
  const info = RECIBO_TIPOS[grupo].items[tipo];
  const isVenta = grupo==="venta";
  const d = {};
  ["nombre","dni","telefono","ciudad","domicilio","direccion","localidad","nro_oferta","fecha_oferta",
   "monto","precio_pub","pct","precio_final","monto_previo","fecha_refuerzo","pct_integrado","motivo",
   "es_reserva_o_sena","monto_ars","fecha_recibo"].forEach(k=>d[k]=formState[k]);

  let montoTxt = "";
  let cuerpo = "";

  if(tipo==="reserva" && isVenta){
    const concepto = d.es_reserva_o_sena==="Seña" ? "seña" : "reserva";
    montoTxt = fmtMoney(d.monto,"USD");
    cuerpo = `<p>Recibí de manos de ${val(d.nombre)}, DNI ${val(d.dni)}, la suma de <b>${montoTxt}</b> en concepto de <b>${concepto}</b> a cuenta de precio
    por la compra del inmueble sito en ${val(d.direccion)}, ${val(d.localidad)}, conforme oferta de compra N° ${val(d.nro_oferta,"—")} de fecha ${fmtDate(d.fecha_oferta)},
    sobre un valor publicado de ${fmtMoney(d.precio_pub,"USD")} (${val(d.pct)}% del valor ofertado).</p>`;
  } else if(tipo==="refuerzo"){
    montoTxt = fmtMoney(d.monto,"USD");
    cuerpo = `<p>Recibí de manos de ${val(d.nombre)}, DNI ${val(d.dni)}, la suma de <b>${montoTxt}</b> en concepto de <b>refuerzo de reserva</b> a cuenta de precio
    por la compra del inmueble sito en ${val(d.direccion)}, ${val(d.localidad)}, conforme oferta N° ${val(d.nro_oferta,"—")} de fecha ${fmtDate(d.fecha_oferta)}.
    El presente refuerzo, sumado a lo ya integrado (${fmtMoney(d.monto_previo,"USD")}), representa el ${val(d.pct)}% del valor final de venta/cierre pactado
    en ${fmtMoney(d.precio_final,"USD")}.</p>`;
  } else if(tipo==="devolucion" && isVenta){
    cuerpo = `<p>Se devuelve a ${val(d.nombre)}, DNI ${val(d.dni)}, la suma de dólares billetes estadounidenses ${numToWordsEs(d.monto)}
    (U\$S ${fmtNumberPlain(d.monto)}), en virtud de ${val(d.motivo,"el motivo acordado entre las partes")}, correspondiente al inmueble ubicado en
    ${val(d.direccion)}.</p>`;
  } else if(tipo==="honorarios" && isVenta){
    montoTxt = fmtMoney(d.monto,"USD");
    cuerpo = `<p>Recibí de manos de ${val(d.nombre)}, DNI ${val(d.dni)}, la suma de <b>${montoTxt}</b> en concepto de <b>honorarios profesionales</b>
    por la intermediación en la compraventa del inmueble sito en ${val(d.direccion)}, ${val(d.localidad)}, oferta N° ${val(d.nro_oferta,"—")} de fecha ${fmtDate(d.fecha_oferta)}.</p>`;
  } else if(tipo==="reserva" && !isVenta){
    montoTxt = `$ ${val(d.monto_ars)}`;
    cuerpo = `<p>Recibí de manos de ${val(d.nombre)}, DNI ${val(d.dni)}, la suma de <b>${montoTxt}</b> en concepto de <b>reserva de alquiler</b>
    (equivalente al 50% del primer mes de locación) por el inmueble sito en ${val(d.direccion)}, ${val(d.localidad)}, oferta de locación N° ${val(d.nro_oferta,"—")}.</p>`;
  } else if(tipo==="devolucion" && !isVenta){
    montoTxt = `$ ${val(d.monto_ars)}`;
    cuerpo = `<p>Se devuelve a ${val(d.nombre)}, DNI ${val(d.dni)}, la suma de <b>${montoTxt}</b> correspondiente a la reserva de alquiler del inmueble sito en
    ${val(d.direccion)}, ${val(d.localidad)}, oferta de locación N° ${val(d.nro_oferta,"—")}, por no haberse concretado la operación.</p>`;
  } else if(tipo==="honorarios" && !isVenta){
    montoTxt = `$ ${val(d.monto_ars)}`;
    cuerpo = `<p>Recibí de manos de ${val(d.nombre)}, DNI ${val(d.dni)}, la suma de <b>${montoTxt}</b> en concepto de <b>honorarios profesionales</b>
    por la intermediación en la locación del inmueble sito en ${val(d.direccion)}, ${val(d.localidad)}, oferta de locación N° ${val(d.nro_oferta,"—")}.</p>`;
  }

  const firmaSub = (tipo==="devolucion" && isVenta) ? `DNI ${val(d.dni)}` : `DNI ${val(d.dni)} · ${val(d.ciudad)}`;

  const body = `
    ${letterhead()}
    <div class="doc-title">${info.titulo}${!isVenta?" (en pesos)":""}</div>
    ${(tipo==="devolucion" && isVenta) ? "" : `<div class="doc-subtitle">${AGENCIA.nombre} · ${AGENCIA.agente}, ${AGENCIA.matricula} · ${fmtDate(d.fecha_recibo)}</div>`}
    ${cuerpo}
    <div class="sign-row">
      ${signBox(val(d.nombre,"&nbsp;"), firmaSub)}
      ${signBox(AGENCIA.agente, `${AGENCIA.nombre} · ${AGENCIA.matricula}`)}
    </div>
    ${docFoot()}
  `;
  showPreview(info.titulo, body);
}

/* ============================================================
   PREVIEW
   ============================================================ */
let lastDocTitle = "";
function showPreview(title, bodyHTML){
  lastDocTitle = title;
  document.getElementById("app").innerHTML = `
    <div class="crumbs no-print"><button class="btn" onclick="goHome()">← Elegir otro documento</button></div>
    <div class="doc-preview">
      <div class="doc-preview-bar no-print">
        <span>Vista previa — ${title}</span>
        <button class="btn" onclick="window.print()">🖨 Imprimir / Guardar PDF</button>
      </div>
      <div class="doc-body">${bodyHTML}</div>
    </div>
  `;
}

/* ============================================================
   HOME + SUBMENUS
   ============================================================ */
const DOC_CARDS = [
  {id:"venta-exclusiva", icon:"📄", title:"Autorización de Venta", desc:"El propietario autoriza a la oficina a vender el inmueble, con o sin exclusividad."},
  {id:"modificacion-precio", icon:"📄", title:"Autorización de Modificación de Precio", desc:"El propietario acepta cambiar el precio de publicación del inmueble."},
  {id:"locacion-exclusiva", icon:"📄", title:"Autorización de Locación Exclusiva", desc:"El propietario autoriza en exclusiva a la oficina a alquilar el inmueble."},
  {id:"oferta-compra", icon:"📄", title:"Oferta de Compra", desc:"Oferta de compra ad referéndum del vendedor, en dólares o pesos."},
  {id:"contraoferta", icon:"📄", title:"Rechazo de Oferta — Contraoferta", desc:"El vendedor rechaza la oferta recibida y formula una contraoferta de precio."},
  {id:"uif", icon:"📄", title:"Documentación UIF", desc:"Declaraciones juradas de sujetos obligados a informar operaciones (Ley 25.246)."},
  {id:"recibos", icon:"🧾", title:"Recibo", desc:"Recibos de reserva, señal, refuerzo, devoluciones u honorarios."},
];

function renderHome(){
  return `
    <div class="page-head">
      <div>
        <h1>Carga de Documentación</h1>
        <div class="sub">${AGENCIA.nombre} · ${AGENCIA.agente}, ${AGENCIA.matricula}</div>
      </div>
    </div>
    <div class="grid">
      ${DOC_CARDS.map(c=>`
        <button class="doc-card" onclick="goTo('${c.id}')">
          <div class="doc-icon">${c.icon}</div>
          <h3>${c.title}</h3>
          <p>${c.desc}</p>
        </button>
      `).join("")}
    </div>
  `;
}

function formPage(title, sub, backLabel, backFn, innerHTML){
  return `
    <div class="crumbs no-print"><button class="btn" onclick="${backFn}">← ${backLabel}</button></div>
    <div class="page-head">
      <div><h1 style="font-size:26px">${title}</h1><div class="sub">${AGENCIA.nombre} · ${AGENCIA.agente}, ${AGENCIA.matricula}</div></div>
    </div>
    ${innerHTML}
  `;
}

function renderUIFHome(){
  return `
    <div class="crumbs no-print"><button class="btn" onclick="goHome()">← Elegir otro documento</button></div>
    <div class="page-head"><div><h1 style="font-size:26px">Documentación UIF</h1><div class="sub">${AGENCIA.nombre} · ${AGENCIA.agente}, ${AGENCIA.matricula}</div></div></div>
    <div class="submenu-grid">
      <button class="doc-card" onclick="goTo('uif-form', {tipo:'Comprador'})"><div class="doc-icon">🧾</div><h3>Comprador</h3><p>Declaración jurada UIF del comprador.</p></button>
      <button class="doc-card" onclick="goTo('uif-form', {tipo:'Vendedor'})"><div class="doc-icon">🧾</div><h3>Vendedor</h3><p>Declaración jurada UIF del vendedor.</p></button>
    </div>
  `;
}

function renderRecibosHome(){
  return `
    <div class="crumbs no-print"><button class="btn" onclick="goHome()">← Elegir otro documento</button></div>
    <div class="page-head"><div><h1 style="font-size:26px">Recibo</h1><div class="sub">${AGENCIA.nombre} · ${AGENCIA.agente}, ${AGENCIA.matricula}</div></div></div>
    <div class="submenu-grid">
      <button class="doc-card" onclick="goTo('recibos-sub', {grupo:'venta'})"><div class="doc-icon">🏠</div><h3>Recibos de Venta</h3><p>${RECIBO_TIPOS.venta.desc}</p></button>
      <button class="doc-card" onclick="goTo('recibos-sub', {grupo:'alquiler'})"><div class="doc-icon">🔑</div><h3>Recibos de Alquiler</h3><p>${RECIBO_TIPOS.alquiler.desc}</p></button>
    </div>
  `;
}

function renderRecibosSub(grupo){
  const items = RECIBO_TIPOS[grupo].items;
  const titles = {
    reserva: grupo==="venta" ? "Recibo de Reserva / Seña" : "Recibo de Reserva de Alquiler",
    refuerzo: "Recibo de Refuerzo de Reserva",
    devolucion: grupo==="venta" ? "Recibo de Devolución de Seña" : "Recibo — Devolución de Reserva de Alquiler",
    honorarios: grupo==="venta" ? "Recibo de Honorarios" : "Recibo de Honorarios (Alquiler)",
  };
  const cards = Object.keys(items).map(k=>`
    <button class="doc-card" onclick="goTo('recibo-form', {grupo:'${grupo}', tipo:'${k}'})">
      <div class="doc-icon">🧾</div><h3>${titles[k]}</h3><p></p>
    </button>`).join("");
  return `
    <div class="crumbs no-print"><button class="btn" onclick="goTo('recibos')">← Volver</button></div>
    <div class="page-head"><div><h1 style="font-size:26px">Carga de Documentación</h1><div class="sub">${AGENCIA.nombre} · ${AGENCIA.agente}, ${AGENCIA.matricula}</div></div></div>
    <div class="submenu-grid">${cards}</div>
  `;
}

/* ============================================================
   MAIN RENDER
   ============================================================ */
function render(){
  const app = document.getElementById("app");
  switch(route.page){
    case "home":
      app.innerHTML = renderHome(); break;
    case "venta-exclusiva":
      app.innerHTML = formPage("Autorización de Venta","","Elegir otro documento","goHome()", renderVentaExclusiva()); break;
    case "modificacion-precio":
      app.innerHTML = formPage("Autorización de Modificación de Precio","","Elegir otro documento","goHome()", renderModificacionPrecio()); break;
    case "locacion-exclusiva":
      app.innerHTML = formPage("Autorización de Locación Exclusiva","","Elegir otro documento","goHome()", renderLocacionExclusiva()); break;
    case "oferta-compra":
      app.innerHTML = formPage("Oferta de Compra","","Elegir otro documento","goHome()", renderOfertaCompra()); break;
    case "contraoferta":
      app.innerHTML = formPage("Rechazo de Oferta — Contraoferta","","Elegir otro documento","goHome()", renderContraoferta()); break;
    case "uif":
      app.innerHTML = renderUIFHome(); break;
    case "uif-form":
      app.innerHTML = formPage(`Documentación UIF — ${route.tipo}`,"","Elegir otro formulario UIF","goTo('uif')", renderUIF(route.tipo)); break;
    case "recibos":
      app.innerHTML = renderRecibosHome(); break;
    case "recibos-sub":
      app.innerHTML = renderRecibosSub(route.grupo); break;
    case "recibo-form":
      app.innerHTML = formPage("Carga de Documentación","","Elegir otro recibo",`goTo('recibos-sub',{grupo:'${route.grupo}'})`, renderReciboForm(route.grupo, route.tipo)); break;
    default:
      app.innerHTML = renderHome();
  }
}

render();
</script>
